// ============================================================
// 插件
// ============================================================
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'maven-publish'
}


// ============================================================
// 项目基础信息
// ============================================================
group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}


// ============================================================
// Minecraft 配置
// ============================================================
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}


// ============================================================
// JiJ：CSC 内嵌到 Core
// ============================================================
jarJar.enable()

sourceSets.main.resources { srcDir 'src/generated/resources' }


// ============================================================
// 仓库
// ============================================================
repositories {
    // 本地仓库：先在 CSC 工程执行 publishToMavenLocal，再构建 Core
    mavenLocal()
    maven {
        url = uri("http://192.168.1.4:8080/releases")
        allowInsecureProtocol = true
    }
}


// ============================================================
// 依赖
// ============================================================
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // CSC：编译期可见，运行时由 Core 的 JiJ 提供
    implementation "${csc_group_id}:sc_csc:${csc_version}"
    jarJar "${csc_group_id}:sc_csc:${csc_version_range}"
    minecraftLibrary "${csc_group_id}:sc_csc:${csc_version}"
}


// ============================================================
// 资源处理（mods.toml / pack.mcmeta 占位符替换）
// ============================================================
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version,
            forge_version_range : forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_license         : mod_license,
            mod_version         : mod_version,
            mod_authors         : mod_authors,
            mod_description     : mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}


// ============================================================
// JAR 清单与重混淆
// ============================================================
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}


// ============================================================
// 编译编码
// ============================================================
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}


// ============================================================
// 冒烟测试（纯 JDK，不启动 MC）
// ============================================================
sourceSets {
    smoke {
        java.srcDir 'tools'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    smokeImplementation.extendsFrom implementation
}

tasks.register('smokeTest', JavaExec) {
    group = 'verification'
    description = '运行 SC Core 内核冒烟测试'
    classpath = sourceSets.smoke.runtimeClasspath
    mainClass = 'KernelSmokeTest'
    jvmArgs '-Dfile.encoding=UTF-8'
}

tasks.named('check') {
    dependsOn 'smokeTest'
}


// ============================================================
// 发布
// ============================================================
def repoToken = project.findProperty("reposiliteToken") ?: ""

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "http://192.168.1.4:8080/releases"
            credentials {
                username = "admin"
                password = repoToken
            }
            allowInsecureProtocol = true
        }
    }
}

// ============================================================
// 部署：重命名完整 JAR 并复制到统一目录
// ============================================================
tasks.register('releaseJar', Copy) {
    // 依赖 jarJar 任务，确保先产出包含 CSC 的 -all JAR
    dependsOn 'jarJar'

    // 源：jarJar 生成的完整 JAR（默认在 build/libs 下，带 -all 后缀）
    from layout.buildDirectory.dir("libs")
    include "*-all.jar"

    // 目标目录
    into "E:\\workspace\\minecraft_mod\\Simple Command\\jars\\core"

    // 重命名规则
    rename { String fileName ->
        "sc_${sc_name}-forge-${minecraft_version}-${project.version}.jar"
    }

}

// 让 build 完成后自动执行部署
tasks.named('build') {
    finalizedBy 'releaseJar'
}